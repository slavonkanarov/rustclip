name: Windows MSI

on:
  push:
    branches: [dev, release, main]
    tags: ['v*']
  pull_request:
    branches: [dev, release, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Set build version
        id: version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'rustclip').version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Cargo.toml must contain a stable three-part version: $version" }
          $buildVersion = switch -Regex ($env:GITHUB_REF) {
            '^refs/heads/dev$' { "$version-dev.$env:GITHUB_RUN_NUMBER"; break }
            '^refs/heads/release$' { "$version-rc.$env:GITHUB_RUN_NUMBER"; break }
            '^refs/heads/main$' { "$version-main.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"; break }
            '^refs/tags/v(.+)$' {
              $tagVersion = $Matches[1]
              if ($tagVersion -notmatch "^$([regex]::Escape($version))(-(rc\.(0|[1-9]\d*)|main\.[1-9]\d*\.[1-9]\d*))?$") {
                throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
              }
              $branch = if ($tagVersion -match '-rc\.') { 'release' } else { 'main' }
              git merge-base --is-ancestor $env:GITHUB_SHA "origin/$branch"
              if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME must point to a commit on $branch" }
              $tagVersion
              break
            }
            default { "$version-dev.$env:GITHUB_RUN_NUMBER" }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTCLIP_BUILD_VERSION=$buildVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$buildVersion"

      - name: Run Rust tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build Windows executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: |
          dotnet tool install wix --version 6.0.2 --tool-path "$env:RUNNER_TEMP/wix" --add-source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/wix/wix.exe" extension add -g WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/wix/wix.exe" extension add -g WixToolset.Util.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer and portable archive
        run: ./scripts/package-windows.ps1 -Wix "$env:RUNNER_TEMP/wix/wix.exe"

      - name: Verify MSI installation, upgrade and removal
        run: ./scripts/test-installer.ps1 -Wix "$env:RUNNER_TEMP/wix/wix.exe"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: rustclip-windows-x64
          path: |
            target/package/*.msi
            target/package/*.zip
            target/package/rustclip.exe
            target/package/LICENSE
            target/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-test-logs
          path: target/installer-test/*.log
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v8
        with:
          name: rustclip-windows-x64
          path: package

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          options=(--verify-tag)
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag="v${{ needs.build.outputs.version }}"
            options=(--target "$GITHUB_SHA")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists"
            exit 0
          fi
          if [[ "$tag" == *-rc.* || "$tag" == *-main.* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$tag" package/* \
            --title "RustClip ${tag#v}" --generate-notes "${options[@]}"
